name: Build AVD Kernel (a15-6.6 aarch64)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'KernelSU variant'
        type: choice
        options:
          - KernelSU-Next
          - KernelSU
          - SukiSU-Ultra
        default: KernelSU-Next
      ksu_commit:
        description: 'KSU commit/tag override (blank = latest)'
        type: string
        default: ''
        required: false
      build_modules:
        description: 'Build virtual device modules (untuk AVD)'
        type: boolean
        default: true

jobs:
  fetch-commits:
    runs-on: ubuntu-latest
    outputs:
      ksu_commit: ${{ steps.commits.outputs.ksu_commit }}
      ksu_variant: ${{ steps.commits.outputs.ksu_variant }}
    steps:
      - name: Fetch Latest Commits
        id: commits
        run: |
          VARIANT="${{ inputs.ksu_variant || 'KernelSU-Next' }}"
          echo "ksu_variant=$VARIANT" >> $GITHUB_OUTPUT

          get_commit() { git ls-remote "$1" "$2" | awk '{print $1}'; }

          case "$VARIANT" in
            KernelSU)
              REPO_URL="https://github.com/tiann/KernelSU.git"; DEFAULT_REF="refs/heads/main" ;;
            KernelSU-Next)
              REPO_URL="https://github.com/KernelSU-Next/KernelSU-Next.git"; DEFAULT_REF="refs/heads/next" ;;
            SukiSU-Ultra)
              REPO_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"; DEFAULT_REF="refs/heads/main" ;;
          esac

          if [ -n "${{ inputs.ksu_commit }}" ]; then
            resolved=$(get_commit "$REPO_URL" "${{ inputs.ksu_commit }}")
            if [ -n "$resolved" ]; then ksu_commit="$resolved"; else ksu_commit="${{ inputs.ksu_commit }}"; fi
          else
            ksu_commit=$(get_commit "$REPO_URL" "$DEFAULT_REF")
          fi
          echo "$VARIANT: $ksu_commit"
          echo "ksu_commit=$ksu_commit" >> $GITHUB_OUTPUT

  build-a15-6-6-aarch64:
    needs: fetch-commits
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/kernel-config/a15-6.6.json
      arch: aarch64
      ksu_variant: ${{ needs.fetch-commits.outputs.ksu_variant }}
      ksu_commit: ${{ needs.fetch-commits.outputs.ksu_commit }}
      build_modules: ${{ inputs.build_modules }}
    secrets: inherit
